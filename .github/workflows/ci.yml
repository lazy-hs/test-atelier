name: Test Atelier CI

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-atelier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-contract:
    name: Platform contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r api/requirements-dev.txt
      - name: Validate native launcher and preflight contracts
        run: python -m pytest -q scripts/tests/test_launchers.py scripts/tests/test_harness_secret_file.py scripts/tests/test_deployment_secret_file.py scripts/tests/test_verify_harness_compose.py scripts/tests/test_verify_artifact_snapshot_pg.py scripts/tests/test_verify_project_export_pg.py scripts/tests/test_verify_harness_case_context_pg.py scripts/tests/test_preflight_production.py scripts/tests/test_harness_backup_platform.py scripts/tests/test_audit_harness_project_storage.py scripts/tests/test_migrate_legacy_harness_session.py scripts/tests/test_remediate_harness_runner.py scripts/tests/test_evaluate_harness_quality.py api/tests/test_deployment_secret_files.py
      - name: Validate scoped Harness API projection on this platform
        run: python -m pytest -q api/tests/test_harness_bridge.py api/tests/test_harness_chunking.py api/tests/test_harness_contracts.py api/tests/test_harness_projector.py api/tests/test_harness_routes.py scripts/tests/test_harness_real_smoke.py scripts/tests/test_harness_smoke_process.py
      - name: Validate project evidence export and direct artifact references
        run: python -m pytest -q api/tests/test_project_export.py api/tests/test_artifact_routes.py api/tests/test_knowledge.py api/tests/test_migrations.py::test_source_document_upload_identity_keeps_legacy_rows_unverified_and_downgrades api/tests/test_migrations.py::test_conversion_output_creation_identity_preserves_legacy_rows_and_downgrades api/tests/test_conversion.py::test_original_upload_streams_verified_bytes_when_file_changes_after_validation
      - name: Check full synthetic project snapshot capacity on this platform
        run: python -m pytest -q scripts/tests/test_benchmark_artifact_relations.py::test_project_snapshot_covers_the_synthetic_project_without_partial_edges
      - name: Validate CLI process-tree termination and Codex workspace lifecycle
        run: python -m pytest -q api/tests/test_cli_provider.py api/tests/test_codex_workbench.py api/tests/test_storage.py
      - name: Reject redirected project files during deletion
        run: python -m pytest -q api/tests/test_project_management.py::test_project_delete_rejects_junction_in_owned_file_directory api/tests/test_project_management.py::test_project_delete_rejects_real_windows_document_junction api/tests/test_conversion.py::test_history_delete_rejects_junction_project_directory
      - name: Reject Windows junctions during stopped backup and restore
        run: python -m pytest -q scripts/tests/test_backup_data.py -k junction
      - name: Parse POSIX local lifecycle scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/setup_and_start_linux.sh scripts/stop_linux.sh
          if [ "$RUNNER_OS" = macOS ]; then
            zsh -n scripts/setup_and_start_macos.command scripts/stop_macos.command
          fi
      - name: Parse native Windows lifecycle scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @('setup_and_start_windows.ps1', 'start_windows.ps1', 'stop_windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $path = (Resolve-Path (Join-Path 'scripts' $name)).Path
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $parseErrors | Out-String | Write-Error; exit 1 }
          }

  api:
    runs-on: ubuntu-latest
    env:
      AI_STUDIO_SESSION_SECRET: ci-only-session-secret-32-characters-long
      AI_STUDIO_ADMIN_PASSWORD: ci-admin-password-123
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: python -m pip install -r api/requirements-dev.txt
      - run: python -m compileall -q api scripts
      - run: python -m pip check
      - run: python -m pip install 'pip-audit>=2.7,<3'
      - run: pip-audit -r api/requirements.txt
      - run: git diff --check
      - run: python -m pytest -q
      - name: Run single-process runtime smoke and validate logs
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          log_file="$runtime_dir/api.log"
          metrics_file="$runtime_dir/metrics-token"
          # Exercise the deployed file-backed path, including Windows-style CRLF.
          (umask 077; printf '%s\r\n' 'ci-runtime-metrics-token-1234' > "$metrics_file")
          AI_STUDIO_ENV=development \
          AI_STUDIO_REQUIRE_MIGRATIONS=0 \
          AI_STUDIO_SESSION_SECRET=ci-runtime-session-secret-32-characters-long \
          AI_STUDIO_ADMIN_PASSWORD=ci-runtime-admin-password-123 \
          AI_STUDIO_RELEASE=ci-${GITHUB_SHA} \
          DATABASE_URL="sqlite:///$runtime_dir/runtime.db" \
          AI_STUDIO_DATA_DIR="$runtime_dir/data" \
          METRICS_TOKEN_FILE="$metrics_file" \
          LOG_FORMAT=json \
          python -m api.uvicorn_entrypoint --host 127.0.0.1 --port 8765 >"$log_file" 2>&1 &
          api_pid=$!
          cleanup() {
            kill -TERM "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/v1/health/ready >/dev/null 2>&1 && break
            sleep 1
          done
          python scripts/production_smoke.py \
            --base-url http://127.0.0.1:8765 \
            --metrics-token-file "$metrics_file" \
            --expected-release "ci-${GITHUB_SHA}" --jsonl \
            | python scripts/validate_log_stream.py
          # Include the graceful-shutdown lifecycle records in the contract
          # check instead of validating only the startup/request portion.
          cleanup
          trap - EXIT
          python scripts/validate_log_stream.py "$log_file"
          grep -q '"event":"application.stopping"' "$log_file"
          grep -q '"event":"application.stopped"' "$log_file"
      - name: Run external worker lifecycle smoke and validate logs
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          mkdir -p "$runtime_dir/data"
          worker_log="$runtime_dir/worker.log"
          export AI_STUDIO_ENV=development
          export AI_STUDIO_REQUIRE_MIGRATIONS=1
          export AI_STUDIO_MIGRATION_HEAD=20261047_auth_session_revocations
          export AI_STUDIO_SESSION_SECRET=ci-worker-session-secret-32-characters-long
          export AI_STUDIO_ADMIN_PASSWORD=ci-worker-admin-password-123
          export DATABASE_URL="sqlite:///$runtime_dir/worker.db"
          export AI_STUDIO_DATA_DIR="$runtime_dir/data"
          export AI_STUDIO_EXTERNAL_WORKER=1
          export AI_STUDIO_WORKER_HEARTBEAT="$runtime_dir/data/.worker-heartbeat"
          export AI_STUDIO_WORKER_HEARTBEAT_SECONDS=1
          export AI_STUDIO_WORKER_POLL_SECONDS=0.2
          export AI_STUDIO_RELEASE="ci-worker-${GITHUB_SHA}"
          export LOG_FORMAT=json
          python -m alembic upgrade head
          python -m api.worker_entrypoint >"$worker_log" 2>&1 &
          worker_pid=$!
          cleanup() {
            kill -TERM "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            test -s "$AI_STUDIO_WORKER_HEARTBEAT" && break
            kill -0 "$worker_pid" 2>/dev/null || { cat "$worker_log"; exit 1; }
            sleep 1
          done
          test -s "$AI_STUDIO_WORKER_HEARTBEAT"
          kill -TERM "$worker_pid"
          wait "$worker_pid"
          trap - EXIT
          python scripts/validate_log_stream.py "$worker_log"
          grep -q '"event":"worker.migrations.checked"' "$worker_log"
          grep -q '"event":"worker.started"' "$worker_log"
          grep -q '"event":"worker.stop_requested"' "$worker_log"
          grep -q '"event":"worker.stopped"' "$worker_log"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Smoke built SPA preview
        working-directory: web
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 >preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill -TERM "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >preview.html 2>/dev/null && break
            sleep 1
          done
          grep -q 'Test Atelier' preview.html
          grep -q 'assets/' preview.html
      - run: npm run lint
        working-directory: web

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose interpolation
        env:
          POSTGRES_PASSWORD: ci-postgres-password-123
          AI_STUDIO_SESSION_SECRET: ci-compose-session-secret-32-characters-long
          AI_STUDIO_ADMIN_PASSWORD: ci-compose-admin-password-123
          TEST_ATELIER_SKILL_ROOT: ${{ github.workspace }}
        run: docker compose config --quiet

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --file api/Dockerfile --tag test-atelier-api:ci .
      - name: Build and validate Web image
        run: |
          docker build --file web/Dockerfile --tag test-atelier-web:ci .
          docker run --rm test-atelier-web:ci -t >nginx-config.log 2>&1
          python scripts/validate_log_stream.py nginx-config.log

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password-123
      AI_STUDIO_SESSION_SECRET: ci-compose-session-secret-32-characters-long
      AI_STUDIO_ADMIN_PASSWORD: ci-compose-admin-password-123
      METRICS_TOKEN: ci-metrics-token-123456
      AI_STUDIO_RELEASE: ci-${{ github.sha }}
      COOKIE_SECURE: "1"
      AI_STUDIO_EXTERNAL_WORKER: "1"
      DATABASE_URL: postgresql+psycopg://ai_studio:ci-postgres-password-123@db:5432/ai_studio
      TEST_ATELIER_SKILL_ROOT: ${{ github.workspace }}/.ci/qa-doc-skills
    steps:
      - uses: actions/checkout@v7
      # The preflight checks the same cryptography baseline used by the API
      # image. Install the declared Linux dependencies instead of relying on
      # whatever packages happen to be preloaded on the GitHub runner.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install -r api/requirements.txt
      - name: Prepare minimal read-only skill fixture
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.preflight_production import HARNESS_SKILL_FILES

          root = Path(os.environ['TEST_ATELIER_SKILL_ROOT'])
          for name in HARNESS_SKILL_FILES:
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text('# CI source fixture\n', encoding='utf-8')
          PY
      - name: Validate production preflight
        run: |
          set -o pipefail
          python scripts/preflight_production.py --compose --jsonl \
            | python scripts/validate_log_stream.py
      - name: Start Compose deployment
        run: docker compose up --build -d
      - name: Run deployment smoke checks
        run: |
          set -o pipefail
          python scripts/production_smoke.py \
            --base-url http://127.0.0.1:8080 \
            --metrics-token "$METRICS_TOKEN" \
            --require-worker --require-web --expected-harness-mode off --attempts 30 --retry-seconds 2 \
            --expected-release "$AI_STUDIO_RELEASE" --jsonl \
            | python scripts/validate_log_stream.py
      - name: Verify document-reference triggers in PostgreSQL
        run: docker compose exec -T api python -m scripts.verify_document_references_pg
      - name: Verify artifact-directory indexes in PostgreSQL
        run: docker compose exec -T api python -m scripts.verify_artifact_directory_pg
      - name: Verify artifact catalogs and project graph snapshots in PostgreSQL
        run: docker compose exec -T -e TEST_ATELIER_PG_SMOKE=1 api python -m scripts.verify_artifact_snapshot_pg
      - name: Verify evidence ZIP snapshot in PostgreSQL
        run: docker compose exec -T -e TEST_ATELIER_PG_SMOKE=1 api python -m scripts.verify_project_export_pg
      - name: Verify Harness case context against a concurrent PostgreSQL decision
        run: docker compose exec -T -e TEST_ATELIER_PG_SMOKE=1 api python -m scripts.verify_harness_case_context_pg
      - name: Validate structured log streams
        run: |
          docker compose logs --no-color --no-log-prefix api worker web \
            | python scripts/validate_log_stream.py
          # The Harness projector is an independently supervised process. Keep
          # its lifecycle in the same structured-log contract so a healthy API
          # cannot mask a stalled or misconfigured projector.
          docker compose logs --no-color --no-log-prefix harness-projector \
            | python scripts/validate_log_stream.py
          docker compose logs --no-color --no-log-prefix harness-projector \
            | grep -q '"event":"harness.projector.started"'
      - name: Run stopped PostgreSQL and Harness storage backup and restore drill
        run: |
          set -euo pipefail
          restore_database=ai_studio_restore
          fixture="$GITHUB_WORKSPACE/.ci/harness-storage-fixture"
          mkdir -p "$fixture/tasks" "$fixture/sessions" "$fixture/backups"
          printf '{"task_id":"ci-task"}\n' > "$fixture/tasks/index.json"
          printf '{"sequence":1,"result":"fixture"}\n' > "$fixture/tasks/ci-task.events.jsonl"
          printf '{"session_id":"ci-session"}\n' > "$fixture/sessions/session.jsonl"
          # The container runs as UID 10001; the synthetic fixture is private
          # to this runner and contains no production data or secrets.
          sudo chown -R 10001:10001 "$fixture"
          cleanup() {
            docker compose exec -T db psql -U ai_studio -d postgres \
              -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS ${restore_database}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # Keep PostgreSQL available for pg_dump, but quiesce every app-side
          # writer before copying uploads and the Host's two persistent roots.
          docker compose stop web api worker harness-projector
          docker compose exec -T db psql -U ai_studio -d postgres \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${restore_database}"
          docker compose run --rm -T --no-deps \
            -v "$fixture/tasks:/mnt/host-tasks:ro" \
            -v "$fixture/sessions:/mnt/host-sessions:ro" \
            -v "$fixture/backups:/mnt/backups" api sh -eu -c '
            python scripts/backup_data.py backup \
              --data-dir /app/data --output-dir /mnt/backups \
              --harness-task-dir /mnt/host-tasks \
              --harness-session-dir /mnt/host-sessions --services-stopped
            archive="$(find /mnt/backups -maxdepth 1 -type f -name "test-atelier-*.tar.gz" -print -quit)"
            test -n "$archive"
            python scripts/backup_data.py verify "$archive"
            DATABASE_URL="${DATABASE_URL%/*}/ai_studio_restore"
            export DATABASE_URL
            python scripts/backup_data.py restore "$archive" \
              --database-url "$DATABASE_URL" --data-dir /tmp/restore-data \
              --harness-task-dir /tmp/restored-tasks \
              --harness-session-dir /tmp/restored-sessions \
              --services-stopped --force
            cmp /mnt/host-tasks/index.json /tmp/restored-tasks/index.json
            cmp /mnt/host-tasks/ci-task.events.jsonl /tmp/restored-tasks/ci-task.events.jsonl
            cmp /mnt/host-sessions/session.jsonl /tmp/restored-sessions/session.jsonl
          ' | python scripts/validate_log_stream.py
          docker compose exec -T db psql -U ai_studio -d "$restore_database" \
            -v ON_ERROR_STOP=1 -tAc 'SELECT version_num FROM alembic_version' \
            | grep -qx '20261047_auth_session_revocations'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down Compose deployment
        if: always()
        run: docker compose down -v
