services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    environment:
      POSTGRES_DB: ai_studio
      POSTGRES_USER: ai_studio
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_studio -d ai_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    init: true
    restart: unless-stopped
    # Application code and the Python runtime are immutable at runtime. The
    # data volume is the only durable write surface; /tmp and HOME remain
    # private tmpfs mounts for parsers such as LibreOffice.
    read_only: true
    security_opt:
      - no-new-privileges:true
    # The API image runs as the unprivileged app user and needs no Linux
    # capabilities. Keep the process boundary explicit if the host runtime
    # grants a broader default capability set.
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      - /home/app:rw,nosuid,nodev,size=128m
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    build:
      context: .
      dockerfile: api/Dockerfile
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - files_data:/app/data
      - ./config/runtime.json:/app/config/runtime.json:ro
      - ../qa-doc-skills:/app/qa-doc-skills:ro
    secrets:
      - postgres_password
      - atelier_session_secret
      - atelier_admin_password
      - atelier_metrics_token
      - harness_scope_secret
      - harness_host_api_token
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 30s

  worker:
    init: true
    restart: unless-stopped
    # Keep the worker root filesystem immutable; only its shared data volume
    # and bounded runtime tmpfs mounts may be written.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      - /home/app:rw,nosuid,nodev,size=128m
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    build:
      context: .
      dockerfile: api/Dockerfile
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - files_data:/app/data
      - ./config/runtime.json:/app/config/runtime.json:ro
      - ../qa-doc-skills:/app/qa-doc-skills:ro
    secrets:
      - postgres_password
      - atelier_session_secret
      - harness_scope_secret
      - harness_host_api_token
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-u", "-m", "api.worker_entrypoint"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,stat,time,urllib.request; p='/app/data/.worker-heartbeat'; s=os.lstat(p); assert stat.S_ISREG(s.st_mode) and time.time()-s.st_mtime<30; urllib.request.urlopen('http://api:8000/api/v1/health/worker',timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 30s

  harness-projector:
    init: true
    restart: unless-stopped
    # The projector only reads the Harness event stream and writes the shared
    # database; it has no HTTP listener or provider credentials of its own.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /home/app:rw,nosuid,nodev,size=64m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - files_data:/app/data
      - ./config/runtime.json:/app/config/runtime.json:ro
    secrets:
      - postgres_password
      - atelier_session_secret
      - harness_scope_secret
      - harness_host_api_token
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-u", "-m", "api.harness_projector"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,stat,time; p='/app/data/.harness-projector-heartbeat'; s=os.lstat(p); assert stat.S_ISREG(s.st_mode) and time.time()-s.st_mtime<30"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 30s

  web:
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /var/cache/nginx:rw,nosuid,nodev,size=64m
      - /var/run:rw,nosuid,nodev,size=16m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      harness-projector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s

volumes:
  db_data:
  files_data:

secrets:
  postgres_password:
    file: ./config/secrets/postgres_password
  atelier_session_secret:
    file: ./config/secrets/atelier_session_secret
  atelier_admin_password:
    file: ./config/secrets/atelier_admin_password
  atelier_metrics_token:
    file: ./config/secrets/atelier_metrics_token
  harness_scope_secret:
    file: ./config/secrets/harness_scope_secret
  harness_host_api_token:
    file: ./config/secrets/harness_host_api_token
