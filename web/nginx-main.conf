# Minimal main configuration for the unprivileged edge image.  The official
# image's default file keeps its PID under /var/run and assumes a root master;
# this variant keeps all runtime writes under the Compose /tmp tmpfs instead.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
