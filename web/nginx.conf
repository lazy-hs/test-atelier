limit_req_zone $binary_remote_addr zone=test_atelier_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=test_atelier_login:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=test_atelier_connections:10m;
proxy_temp_path /tmp/nginx-proxy 1 2;
client_body_temp_path /tmp/nginx-client 1 2;
# Access logs must remain useful without copying token-like path segments into
# the collector. Unknown paths containing a credential keyword are collapsed
# to a fixed marker; normal SPA and API routes retain their URI for diagnosis.
map $uri $log_uri {
    default $uri;
    ~*(token|password|secret|api[-_]?key|access[-_]?token|refresh[-_]?token) "[REDACTED]";
}
map $scheme $hsts_header {
    default "";
    https "max-age=31536000; includeSubDomains";
}

# Keep the edge log searchable without copying cookies, authorization headers,
# query strings or request bodies into the log stream.
log_format test_atelier_json escape=json
    '{"timestamp":"$time_iso8601","service":"test-atelier-web",'
    '"environment":"production","schema_version":1,"level":"INFO","logger":"nginx",'
    '"event":"request.completed",'
    '"request_id":"$request_id","method":"$request_method","path":"$log_uri",'
    '"status":$status,"upstream_status":"$upstream_status",'
    '"duration_seconds":$request_time,"upstream_duration_seconds":"$upstream_response_time",'
    '"request_bytes":$request_length,"bytes":$body_bytes_sent,'
    '"remote_addr":"$remote_addr"}';
# Send container logs to stdout/stderr so Docker's configured json-file
# rotation and the deployment log collector can observe the edge layer.
access_log /dev/stdout test_atelier_json;
error_log /dev/stderr warn;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    limit_conn test_atelier_connections 40;
    limit_conn_status 429;
    # Requirement documents are chunked by the skill runner; keep the edge
    # limit just above the API's 100 MB per-document ceiling.
    client_max_body_size 110m;
    # Large requirement packs may arrive over a slower workstation link.
    # Keep a finite deadline while allowing the 100 MiB upload to complete.
    client_body_timeout 120s;
    send_timeout 120s;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Request-ID $request_id always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # The built SPA only needs same-origin modules and API calls. Keep inline
    # styles for component libraries, but disallow executable inline scripts,
    # plugins and framing at the browser boundary.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:;" always;
    add_header Strict-Transport-Security $hsts_header always;

    location /api/ {
        limit_req zone=test_atelier_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 240s;
    }

    # Login has a stricter client-address limit than ordinary API traffic.
    # Keep the application-level limiter as a second line of defense for
    # direct API access and deployments with more than one proxy.
    location = /api/v1/auth/login {
        limit_req zone=test_atelier_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
